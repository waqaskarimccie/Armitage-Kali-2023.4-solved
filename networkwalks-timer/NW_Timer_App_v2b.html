<!DOCTYPE html>
<!-- NW Timer App v2b -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Networkwalks Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Hide the Tawk.to chat widget (its iframe has no tawk.to src, so match by title / wrapper class) */
  iframe[title*="chat widget" i], iframe[title*="chat bubble" i], div.widget-visible,
  #tidio-chat, #tidio-chat-iframe, .tawk-min-container, .tawk-bubble-container,
  iframe[src*="tawk.to"], div[id^="tawk-"] { display:none !important; }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Oswald','Segoe UI',Arial,sans-serif;
    color:#fff; background:#06070d; overflow:hidden;
    display:flex; flex-direction:column; height:100vh; height:100dvh;
    --core:#fff3c4; --c2:#ffb300; --c3:#ff7a00; --accent:#ffe49a;
    --bgA:rgba(120,50,10,.45); --bgB:rgba(8,3,2,.93); --rot:0deg;
  }

  /* Background: photo (hue-shifted to match each screen) + tint. Falls back to plain dark. */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#06070d;overflow:hidden;}
  .bgimg{position:absolute;inset:-2%;background:center/cover no-repeat;filter:hue-rotate(var(--rot)) saturate(1.1);}
  .bgtint{position:absolute;inset:0;background:radial-gradient(ellipse 85% 75% at 50% 42%,var(--bgA) 0%,var(--bgB) 100%);}

  /* ===== Stage: text sizes use container units, so everything fits the space above the control bar ===== */
  .stage{position:relative;z-index:1;flex:1;min-height:0;width:100%;container-type:size;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    overflow:hidden;padding:0 2cqw;}
  .brand{height:8.5cqh;margin-bottom:1.2cqh;display:flex;align-items:center;justify-content:center;}
  .brand img{height:100%;filter:drop-shadow(0 0 .5cqh var(--c2)) drop-shadow(0 0 1.6cqh var(--c3));}
  .brand .brandtxt{display:none;font-size:4.5cqh;font-weight:700;letter-spacing:.2em;color:var(--accent);
    text-shadow:0 0 .5em var(--c2);}
  .screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;}
  .screen.active{display:flex;}
  .fit{white-space:nowrap;}

  /* Neon text: bold, tight glow so it stays crisp after Zoom's compression */
  .neon{font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.05;
    color:var(--core);-webkit-text-stroke:.012em var(--core);
    text-shadow:0 0 .04em var(--core),0 0 .13em var(--c2),0 0 .32em var(--c3);}
  .plain{font-weight:700;color:#fff;line-height:1.2;text-shadow:0 .08em .3em rgba(0,0,0,.9);}
  .accent{color:var(--accent);}
  .frame{border:.45cqw solid var(--c2);border-radius:999px;padding:.5cqh 3cqw;margin-bottom:1.4cqh;
    box-shadow:0 0 1.4cqw var(--c2),0 0 3.6cqw var(--c3),inset 0 0 1.4cqw var(--c3);background:rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;}
  .frame .neon{line-height:1;padding-top:.07em;}
  .h-xl{font-size:calc(min(12.5cqw,15cqh) * var(--fit,1) * var(--k,1));}
  .h-lg{font-size:calc(min(8cqw,10.5cqh) * var(--fit,1));}
  .h-md{font-size:calc(min(5cqw,6.4cqh) * var(--fit,1) * var(--k,1));}
  .t-lg{font-size:calc(min(4.2cqw,5.4cqh) * var(--fit,1) * var(--k,1));}
  .t-md{font-size:calc(min(3.6cqw,4.6cqh) * var(--fit,1));}
  .mt{margin-top:1.1cqh;}
  .digits{font-feature-settings:"tnum";font-variant-numeric:tabular-nums;margin:.2cqh 0;line-height:1;}
  .digits.w{font-size:min(20cqw,26cqh);}
  .digits.b{font-size:min(24cqw,38cqh);}
  .sublabel{font-size:min(3.6cqw,5cqh);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);text-shadow:0 0 .5em var(--c2),0 .08em .25em #000;min-height:1.3em;}
  .sublabel.bigat{font-size:min(5.6cqw,8cqh);}
  .warn{--core:#ffe3dc;--c2:#ff3b1a;--c3:#d10000;}
  .flash{animation:neonFlash 1s infinite;}
  @keyframes neonFlash{0%,100%{opacity:1;}50%{opacity:.28;}}
  @media (prefers-reduced-motion:reduce){.flash{animation:none;}}

  #wTimerBox{display:none;flex-direction:column;align-items:center;margin-top:1.4cqh;}
  #wTimerBox.on{display:flex;}
  body[data-wt="off"] #sc-welcome{--k:1.18;}
  .qmark{font-size:min(34cqh,42cqw);line-height:.95;}

  /* WhatsApp card */
  .wa-card{margin-top:1.8cqh;display:flex;align-items:center;justify-content:center;gap:2.2cqw;
    padding:1.3cqh 3cqw;border-radius:2.4cqh;background:rgba(2,12,7,.62);
    border:.35cqw solid #25d366;box-shadow:0 0 2cqw rgba(37,211,102,.55),inset 0 0 1.6cqw rgba(37,211,102,.25);}
  .wa-logo{width:min(10cqw,14cqh);height:min(10cqw,14cqh);flex:none;border-radius:50%;background:#25d366;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 1.6cqw rgba(37,211,102,.8);}
  .wa-logo img{width:70%;height:70%;}
  .wa-txt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;}
  .wa-cap{font-size:min(3cqw,4cqh);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
  .wa-num{font-size:min(9cqw,12cqh);font-weight:700;letter-spacing:.03em;white-space:nowrap;line-height:1.05;color:#fff;
    text-shadow:0 0 .1em #25d366,0 0 .3em rgba(37,211,102,.75),0 .05em .15em #000;}

  /* ===== Quiet control bar ===== */
  .dock{position:relative;z-index:3;flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;
    padding:4px 10px;font-size:12px;background:rgba(0,0,0,.4);border-top:1px solid rgba(255,255,255,.12);
    opacity:.38;transition:opacity .2s;}
  .dock:hover,.dock:focus-within{opacity:1;}
  .dock button,.dock select,.dock input[type=text],.dock input[type=number],.dock input[type=time]{
    font-family:inherit;font-size:12px;font-weight:500;padding:3px 8px;border-radius:5px;color:rgba(255,255,255,.85);
    background:transparent;border:1px solid rgba(255,255,255,.2);}
  .dock button{cursor:pointer;}
  .dock button:hover{background:rgba(255,255,255,.14);color:#fff;}
  .dock button.sel{border-color:var(--c2);color:#fff;background:rgba(255,255,255,.1);}
  .dock button:disabled{opacity:.4;}
  .dock input[type=text],.dock input[type=number],.dock input[type=time]{background:rgba(255,255,255,.08);color-scheme:dark;}
  .dock input[type=number]{width:70px;} .dock input[type=time]{width:100px;} .dock input.numIn{width:150px;}
  .dock .sep{width:1px;height:14px;background:rgba(255,255,255,.22);margin:0 3px;}
  .dock .grp{display:flex;flex-wrap:wrap;align-items:center;gap:5px;}
  .dock .lbl{color:rgba(255,255,255,.7);}
  .dock .sp{flex:1;}
  .dock a{color:rgba(255,255,255,.65);text-decoration:none;font-size:11px;} .dock a:hover{color:#fff;}
  .dock .pop{display:none;flex-basis:100%;align-items:center;gap:6px;padding:3px 0;}
  .dock .pop.open{display:flex;}
  .dock .msg{color:#ffb4a6;}
  .rad{display:flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border-radius:5px;cursor:pointer;
    border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:12px;}
  .rad input{appearance:none;-webkit-appearance:none;width:12px;height:12px;border-radius:50%;border:2px solid #9aa;margin:0;cursor:pointer;}
  .rad input:checked{background:#25d366;border-color:#25d366;box-shadow:inset 0 0 0 2px #05150c;}
  .rad.sel{border-color:#25d366;color:#fff;background:rgba(37,211,102,.14);}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:1px;}
  #showBtn{display:none;position:fixed;right:8px;bottom:6px;z-index:4;font-family:inherit;font-size:13px;padding:2px 9px;
    border-radius:5px;cursor:pointer;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);opacity:.3;}
  #showBtn:hover{opacity:1;}
  body.nodock .dock{display:none;}
  body.nodock #showBtn{display:block;}
  body[data-wt="off"] .needTimer{display:none !important;}

  /* ===== Settings tab (admin view) ===== */
  .stage.is-settings{justify-content:flex-start;overflow-y:auto;padding:14px 2cqw 24px;text-align:left;}
  .stage.is-settings .brand{display:none;}
  #sc-settings{align-items:stretch;justify-content:flex-start;max-width:1200px;font-size:14px;}
  .set-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px;}
  .set-head h1{font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--core);text-shadow:0 0 12px var(--c2);}
  .set-head p{color:rgba(255,255,255,.7);font-size:14px;font-weight:500;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;}
  .card{background:rgba(7,9,16,.82);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px 14px;}
  .card h2{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;
    display:flex;align-items:center;gap:8px;}
  .card h2 .sp{flex:1;}
  .card label.f{display:flex;flex-direction:column;gap:2px;margin-bottom:7px;font-size:12px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.04em;}
  .card input[type=text],.card select{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:6px;color:#fff;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);width:100%;color-scheme:dark;}
  .card select option{color:#000;}
  .card button{font-family:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer;color:#fff;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);}
  .card button:hover{background:rgba(255,255,255,.22);}
  .card button.danger{border-color:#ff6a4d;}
  .colors{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 8px;}
  .colors label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:rgba(255,255,255,.72);}
  .colors input[type=color]{width:34px;height:26px;border:1px solid rgba(255,255,255,.4);border-radius:5px;background:none;padding:0;cursor:pointer;}
  .chk{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:14px;font-weight:600;}
  .chk input{width:16px;height:16px;}
  .note{font-size:12px;color:rgba(255,255,255,.65);line-height:1.5;font-weight:500;}
  .note b{color:#fff;}
  .ok{color:#7dffb1;} .bad{color:#ffb4a6;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
</head>
<body data-screen="welcome" data-wt="off">

<div class="bg"><div class="bgimg" id="bgimg"></div><div class="bgtint"></div></div>

<main class="stage" id="stage">
  <div class="brand">
    <img id="logo" alt="Networkwalks Academy">
    <span class="brandtxt">NETWORKWALKS ACADEMY</span>
  </div>

  <!-- WELCOME -->
  <section class="screen active" id="sc-welcome" aria-label="Welcome screen">
    <div class="frame"><div class="neon h-xl fit" id="wTitle"></div></div>
    <div class="neon h-md fit" id="wL1"></div>
    <div class="plain t-lg fit mt" id="wL2"></div>
    <div class="plain t-lg accent fit mt" id="wL3"></div>
    <div id="wTimerBox">
      <div class="sublabel" id="wLabel"></div>
      <div class="neon digits w" id="wTime">05:00</div>
    </div>
  </section>

  <!-- BREAK -->
  <section class="screen" id="sc-break" aria-label="Break timer">
    <div class="frame" id="bFrame"><div class="neon h-lg fit" id="bHead"></div></div>
    <div class="sublabel" id="bSub">&nbsp;</div>
    <div class="neon digits b" id="bTime">15:00</div>
  </section>

  <!-- QUESTIONS -->
  <section class="screen" id="sc-questions" aria-label="Questions time">
    <div class="neon qmark">?</div>
    <div class="neon h-lg fit" id="qTitle"></div>
    <div class="plain t-md accent fit mt" id="qNote"></div>
  </section>

  <!-- END -->
  <section class="screen" id="sc-end" aria-label="End screen">
    <div class="frame"><div class="neon h-lg fit" id="eTitle"></div></div>
    <div class="plain t-lg fit" id="eL1"></div>
    <div class="plain t-lg accent fit" id="eL2"></div>
    <div class="plain t-md fit mt" id="eL3"></div>
    <div class="plain t-md fit" id="eL4"></div>
    <div class="wa-card" id="waCard">
      <div class="wa-logo" aria-hidden="true"><img id="waLogo" alt=""></div>
      <div class="wa-txt">
        <div class="wa-cap" id="eCap"></div>
        <div class="wa-num" id="waNum"></div>
      </div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="sc-settings" aria-label="Settings">
    <div class="set-head"><h1>Settings</h1><p>Admin view. Changes apply instantly and are saved in this browser.</p></div>
    <div class="cards" id="cards"></div>
  </section>
</main>

<!-- ===== Quiet control bar ===== -->
<div class="dock" id="dock">
  <div class="grp" id="tabs">
    <button class="tab" data-screen="welcome">Welcome</button>
    <button class="tab" data-screen="break">Break</button>
    <button class="tab" data-screen="questions">Questions</button>
    <button class="tab" data-screen="end">End</button>
    <button class="tab" data-screen="settings">&#9881; Settings</button>
  </div>
  <span class="sep"></span>
  <div class="grp" id="ctx"></div>
  <span class="sp"></span>
  <a href="https://www.networkwalks.com" target="_blank" rel="noopener">www.networkwalks.com</a>
  <button id="hideBtn" title="Hide controls (H)" aria-label="Hide controls">&#9662;</button>

  <div class="pop" id="customPop">
    <span class="lbl" id="minLbl">Minutes</span>
    <input type="number" id="customMin" min="0.1" max="180" step="any" placeholder="e.g. 7.5" aria-label="Custom minutes">
    <button id="customSet">Set</button>
    <span class="sep"></span>
    <span class="lbl" id="atLbl">Back at</span>
    <input type="time" id="atTime" aria-label="Target time">
    <button id="atSet">Start</button>
    <span class="msg" id="customMsg" role="alert"></span>
  </div>
</div>
<button id="showBtn" title="Show controls (H)" aria-label="Show controls">&#9652;</button>

<div class="sr-only" id="live" aria-live="polite"></div>

  var DEF={

    },

  };
  var NEUTRAL={glow:'#9db4ff',outer:'#4a5fd0',accent:'#cfd8ff'};
  var BASE_TITLE='Networkwalks Academy';

  /* ---------- storage (never throws) ---------- */
  var store={
    get:function(k,d){try{var v=localStorage.getItem('nwTimerV2b.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
    set:function(k,v){try{localStorage.setItem('nwTimerV2b.'+k,JSON.stringify(v));}catch(e){}}
  };
  function oldGet(k){try{var v=localStorage.getItem('nwTimerV2.'+k);return v===null?undefined:JSON.parse(v);}catch(e){return undefined;}}

  /* ---------- config: C = defaults + saved changes. Only changed values are saved. ---------- */
  var C=JSON.parse(JSON.stringify(DEF));
  var urlKeys={};
  function flat(o,p,out){out=out||{};for(var k in o){var v=o[k],pk=p?p+'.'+k:k;
    if(v&&typeof v==='object'&&!Array.isArray(v))flat(v,pk,out);else out[pk]=v;}return out;}
  var DEFFLAT=flat(DEF);
  function getP(path){return path.split('.').reduce(function(o,k){return o==null?o:o[k];},C);}
  function setP(path,val){var a=path.split('.'),o=C;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=val;}
  function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}
  function save(){
    var out={},cur=flat(C);
    for(var k in cur){if(urlKeys[k])continue;if(!same(cur[k],DEFFLAT[k]))out[k]=cur[k];}
    store.set('cfg',out);
  }
  function cleanPresets(a){
    if(!Array.isArray(a))return null;
    var out=[];a.forEach(function(n){n=parseFloat(n);if(n>=0.1&&n<=180&&out.indexOf(n)<0)out.push(n);});
    out.sort(function(a,b){return a-b;});
    return out.length&&out.length<=6?out:null;
  }
  function validValue(k,v){
    if(!(k in DEFFLAT))return false;
    if(typeof v!==typeof DEFFLAT[k])return false;
    if(/^colors\./.test(k))return /^#[0-9a-f]{6}$/i.test(v);
    if(k==='presets')return !!cleanPresets(v);
    if(k==='wa.sel')return v===0||v===1||v===2;
    if(k==='sound')return ['bell','chime','beep','digital'].indexOf(v)>=0;
    return true;
  }
  (function load(){
    var o=store.get('cfg',null);
    if(o&&typeof o==='object'){for(var k in o){if(validValue(k,o[k]))setP(k,o[k]);}return;}
    // first run of v2b: pick up anything saved by v2
    var p=cleanPresets(oldGet('presets'));if(p)setP('presets',p);
    var h=oldGet('heading');if(typeof h==='string'&&h)setP('brk.title',h.slice(0,24));
    var w=oldGet('wa');if(w===0||w===1)setP('wa.sel',w);
    var s=oldGet('sound');if(validValue('sound',s))setP('sound',s);
    var m=oldGet('mute');if(typeof m==='boolean')setP('mute',m);
  })();
  function cfgSet(path,val){setP(path,val);delete urlKeys[path];save();}

  /* ---------- colour helpers ---------- */
  function hex2rgb(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
  function rgb2hex(a){return '#'+a.map(function(x){x=Math.round(Math.max(0,Math.min(255,x)));return (x<16?'0':'')+x.toString(16);}).join('');}
  function mix(h1,h2,t){var a=hex2rgb(h1),b=hex2rgb(h2);return rgb2hex(a.map(function(x,i){return x+(b[i]-x)*t;}));}
  function hueOf(h){
    var c=hex2rgb(h).map(function(x){return x/255;}),mx=Math.max(c[0],c[1],c[2]),mn=Math.min(c[0],c[1],c[2]),d=mx-mn,hh=0;
    if(d){if(mx===c[0])hh=((c[1]-c[2])/d)%6;else if(mx===c[1])hh=(c[2]-c[0])/d+2;else hh=(c[0]-c[1])/d+4;hh*=60;if(hh<0)hh+=360;}
    return hh;
  }
  function rgba(h,a){var c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

  /* ---------- state ---------- */
  var S={screen:'welcome',dockHidden:false};
  var T={
    welcome:{on:false,total:300,remaining:300,endAt:0,state:'idle',sel:5,atLabel:'',lastA:-1},
    brk:    {on:true, total:900,remaining:900,endAt:0,state:'idle',sel:15,atLabel:'',lastA:-1}
  };
  function key(){return S.screen==='welcome'?'welcome':(S.screen==='break'?'brk':null);}
  function colorKey(){return S.screen==='break'?'brk':S.screen;}

  function pad(n){return (n<10?'0':'')+n;}
  function fmt(s){return pad(Math.floor(s/60))+':'+pad(s%60);}
  function rem(t){return t.state==='running'?Math.max(0,Math.ceil((t.endAt-Date.now())/1000)):t.remaining;}
  function clock12(d){var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap;}
  var live=$('#live');
  function announce(msg){live.textContent='';setTimeout(function(){live.textContent=msg;},60);}

  /* ---------- Tawk.to chat widget: keep it hidden ---------- */
  function hideTawk(){
    try{if(window.Tawk_API&&typeof window.Tawk_API.hideWidget==='function'){window.Tawk_API.hideWidget();return true;}}catch(e){}
    return false;
  }
  try{
    window.Tawk_API=window.Tawk_API||{};
    var prevOnLoad=window.Tawk_API.onLoad;
    window.Tawk_API.onLoad=function(){try{if(typeof prevOnLoad==='function')prevOnLoad();}catch(e){}hideTawk();};
  }catch(e){}
  (function poll(n){if(!hideTawk()&&n<120)setTimeout(function(){poll(n+1);},500);})(0);

  /* ---------- audio / alarm ---------- */
  var ac=null,alarm=null;
  function ensureAudio(){
    try{
      if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}
      if(ac&&ac.state==='suspended')ac.resume();
    }catch(e){}
  }
  function tone(dest,type,f,t,d,v){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.05);
  }
  var SOUNDS={
    beep:function(m,t){[0,.35,.7].forEach(function(x){tone(m,'sine',880,t+x,.3,.3);});},
    bell:function(m,t){tone(m,'sine',660,t,1.6,.35);tone(m,'sine',1320,t,1.1,.14);tone(m,'sine',990,t+.65,1.4,.3);},
    chime:function(m,t){[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(m,'triangle',f,t+i*.25,.7,.25);});},
    digital:function(m,t){for(var i=0;i<4;i++)tone(m,'square',1000,t+i*.18,.1,.1);}
  };
  function playAlarm(preview){
    stopAlarm();
    if(C.mute&&!preview)return;
    ensureAudio();if(!ac)return;
    var master=ac.createGain();master.gain.value=1;master.connect(ac.destination);
    var t0=ac.currentTime+0.05,rounds=preview?1:5,fn=SOUNDS[C.sound]||SOUNDS.bell;
    for(var r=0;r<rounds;r++)fn(master,t0+r*2.4);
    alarm={master:master};
  }
  function stopAlarm(){if(alarm){try{alarm.master.disconnect();}catch(e){}alarm=null;}}

  /* ---------- timer engine (timestamp based: never drifts) ---------- */
  function setDuration(k,min,sel){
    var t=T[k];stopAlarm();
    t.total=Math.max(1,Math.round(min*60));t.remaining=t.total;t.state='idle';t.sel=sel;t.atLabel='';t.lastA=-1;
    if(k==='welcome')t.on=true;
    render();
  }
  function start(k){
    var t=T[k];stopAlarm();ensureAudio();
    if(t.state==='done')t.remaining=t.total;
    t.state='running';t.endAt=Date.now()+t.remaining*1000;t.lastA=-1;
    render();announce('Timer started');
  }
  function pause(k){var t=T[k];t.remaining=rem(t);t.state='paused';render();announce('Paused');}
  function toggle(k){var t=T[k];if(!t.on)return;if(t.state==='running')pause(k);else start(k);}
  function reset(k){
    var t=T[k];stopAlarm();
    t.remaining=t.total;t.state='idle';t.lastA=-1;
    if(t.atLabel){t.atLabel='';t.sel='custom';}
    render();
  }
  function adjust(k,deltaSec){
    var t=T[k];if(!t.on||t.state==='done')return;
    if(t.state==='running'){var r=rem(t)+deltaSec;if(r<5)r=5;t.endAt=Date.now()+r*1000;}
    else t.remaining=Math.max(5,t.remaining+deltaSec);
    t.total=Math.max(5,t.total+deltaSec);t.sel='custom';t.atLabel='';
    render();
  }
  function finish(k){
    var t=T[k];t.state='done';t.remaining=0;
    render();playAlarm(false);announce(k==='welcome'?'Starting now':'Time is up');
  }
  function tick(){
    var now=Date.now();
    ['welcome','brk'].forEach(function(k){
      var t=T[k];
      if(t.state==='running'){
        if(now>=t.endAt){finish(k);return;}
        var r=rem(t);
        if(k===key()&&r!==t.lastA&&(r%60===0||r===30||r===10)){
          t.lastA=r;announce(r>=60?(r/60)+(r===60?' minute':' minutes')+' remaining':r+' seconds remaining');
        }
      }
    });
    renderDisplay();
  }

  /* ---------- text fitting: long edited text shrinks instead of overflowing ---------- */
  function fitAll(){
    var st=$('#stage');if(!st||S.screen==='settings')return;
    var full=st.clientWidth*0.94;
    $$('.fit').forEach(function(el){
      if(!el.offsetParent)return;
      el.style.setProperty('--fit','1');
      var avail=full-(el.parentNode.classList.contains('frame')?st.clientWidth*0.09:0),w=el.offsetWidth;
      if(w>avail)el.style.setProperty('--fit',Math.max(.35,avail/w).toFixed(3));
    });
  }

    $('#wTime').classList.toggle('warn',wWarn);

    var ok;try{localStorage.setItem('nwTimerV2b.probe','1');localStorage.removeItem('nwTimerV2b.probe');ok=true;}catch(e){ok=false;}
    el.className='note '+(ok?'ok':'bad');
    el.textContent=ok?('Settings are saved automatically in this browser and survive restarts. Protected from automatic clean-up: '+
      (persisted===true?'yes':(persisted===false?'not guaranteed (clearing site data will erase them)':'checking…'))+'.')
      :'This browser is blocking storage (private window?). Settings will not be remembered.';
  }
  try{
    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persist().then(function(p){persisted=p;paintStorage();},function(){persisted=false;paintStorage();});
    }
  }catch(e){}

  /* ---------- wiring ---------- */
  $$('.tab').forEach(function(b){b.onclick=function(){setScreen(b.getAttribute('data-screen'));};});
  $('#hideBtn').onclick=function(){S.dockHidden=true;render();};
  $('#showBtn').onclick=function(){S.dockHidden=false;render();};

  $('#customSet').onclick=function(){
    var k=key();if(!k)return;
    var v=parseFloat($('#customMin').value);
    if(!(v>=0.1&&v<=180)){$('#customMsg').textContent='Enter 0.1 to 180 minutes.';return;}
    setDuration(k,v,'custom');$('#customMin').value='';$('#customPop').classList.remove('open');
  };
  $('#customMin').addEventListener('keydown',function(e){if(e.key==='Enter')$('#customSet').click();});
  $('#atSet').onclick=function(){
    var k=key();if(!k)return;
    var v=$('#atTime').value;
    if(!v){$('#customMsg').textContent='Pick a time first.';return;}
    var p=v.split(':'),d=new Date();d.setHours(+p[0],+p[1],0,0);
    var diff=Math.round((d.getTime()-Date.now())/1000);
    if(diff<5){$('#customMsg').textContent='That time has already passed today.';return;}
    if(diff>180*60){$('#customMsg').textContent='Maximum is 3 hours ahead.';return;}
    var t=T[k];
    if(k==='welcome')t.on=true;
    t.total=diff;t.remaining=diff;t.sel='custom';t.state='idle';
    start(k);t.atLabel=clock12(d);
    $('#customPop').classList.remove('open');render();
  };
  $('#atTime').addEventListener('keydown',function(e){if(e.key==='Enter')$('#atSet').click();});

  function toggleMute(){cfgSet('mute',!C.mute);if(C.mute)stopAlarm();announce(C.mute?'Sound off':'Sound on');
    if(S.screen==='settings')buildSettings();}
  function toggleFs(){
    try{
      if(document.fullscreenElement)document.exitFullscreen();
      else (document.documentElement.requestFullscreen||function(){}).call(document.documentElement);
    }catch(e){}
  }

  // Unlock audio on first interaction; drop focus after mouse clicks so Space never double-fires a button
  document.addEventListener('click',function(e){ensureAudio();if(e.detail>0&&e.target.tagName==='BUTTON')e.target.blur();},true);

  /* ---------- keyboard shortcuts ---------- */
  function isTyping(el){
    if(!el||!el.tagName)return false;
    if(el.tagName==='TEXTAREA'||el.tagName==='SELECT')return true;
    return el.tagName==='INPUT'&&['radio','checkbox','button'].indexOf(el.type)<0;
  }
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(isTyping(e.target))return;
    var k=key(),c=e.key,handled=true;
    if(c===' '||c==='Spacebar'){if(k)toggle(k);}
    else if(c==='r'||c==='R'){if(k)reset(k);}
    else if(c==='+'||c==='='){if(k)adjust(k,60);}
    else if(c==='-'||c==='_'){if(k)adjust(k,-60);}
    else if(c==='w'||c==='W')setScreen('welcome');
    else if(c==='b'||c==='B')setScreen('break');
    else if(c==='q'||c==='Q')setScreen('questions');
    else if(c==='e'||c==='E')setScreen('end');
    else if(c==='s'||c==='S')setScreen('settings');
    else if(c==='f'||c==='F')toggleFs();
    else if(c==='m'||c==='M')toggleMute();
    else if(c==='h'||c==='H'){S.dockHidden=!S.dockHidden;render();}
    else if((c==='1'||c==='2'||c==='3')&&S.screen==='end'){cfgSet('wa.sel',+c-1);applyTexts();render();}
    else if(c==='Escape')$('#customPop').classList.remove('open');
    else handled=false;
    if(handled)e.preventDefault();
  });
  document.addEventListener('keyup',function(e){if(e.key===' '&&!isTyping(e.target))e.preventDefault();});

  /* ---------- screen wake lock ---------- */
  var wl=null;
  function lockScreen(){
    try{
      if('wakeLock' in navigator&&document.visibilityState==='visible'&&!wl){
        navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){wl=null;});
      }
    }catch(e){}
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lockScreen();tick();}});
  lockScreen();

  /* ---------- URL parameters: ?screen=break&min=10&title=Lunch&wa=2 (not saved unless you edit that setting) ---------- */
  try{
    var q=new URLSearchParams(location.search);
    var sc=q.get('screen');
    if(['welcome','break','questions','end','settings'].indexOf(sc)>=0)S.screen=sc;
    var ttl=q.get('title');if(ttl){C.brk.title=ttl.slice(0,24);urlKeys['brk.title']=1;}
    var wa=q.get('wa');if(wa==='1'||wa==='2'||wa==='3'){C.wa.sel=+wa-1;urlKeys['wa.sel']=1;}
    var mn=parseFloat(q.get('min'));
    if(mn>=0.1&&mn<=180){
      var kk=(S.screen==='welcome')?'welcome':'brk';
      T[kk].on=true;T[kk].total=Math.round(mn*60);T[kk].remaining=T[kk].total;T[kk].sel=C.presets.indexOf(mn)>=0?mn:'custom';
    }
  }catch(e){}

  /* ---------- go ---------- */
  applyBg();applyTexts();
  if(S.screen==='settings')buildSettings();
  setInterval(tick,250);
  render();
  if(window.ResizeObserver)new ResizeObserver(function(){fitAll();}).observe($('#stage'));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
  window.addEventListener('resize',fitAll);
})();
</script>
</body>
</html>
